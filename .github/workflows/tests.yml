name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m geoform_phonons --demo-input /tmp/cubic_input.json --output /tmp/cubic_result.json --mesh 4 --points 8
      - run: python -m json.tool /tmp/cubic_result.json > /dev/null
  phonopy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . phonopy
      - run: python scripts/check_phonopy_reference.py
