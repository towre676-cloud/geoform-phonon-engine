name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m geoform_phonons --demo-input /tmp/cubic_input.json --output /tmp/cubic_result.json --mesh 4 --points 8
      - run: python -m json.tool /tmp/cubic_result.json > /dev/null
  phonopy-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'phonopy==4.9.0'
      - run: python scripts/check_phonopy_reference.py
      - run: python -m unittest discover -s tests -p test_phonondb.py -v
  real-mineral-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r benchmarks/requirements.txt
      - name: Download immutable, hash-checked Phonopy mineral datasets
        run: python scripts/fetch_reference_sources.py --destination benchmarks/upstream
      - name: Audit VASP archives and compare all pinned crystal datasets
        run: python scripts/benchmark_minerals.py --data-dir benchmarks/upstream --output-dir benchmarks/generated --mesh 8 --points 24
      - name: Build independently checked site-ready archive
        run: python scripts/build_site_bundle.py --results benchmarks/generated --output benchmarks/geoform_site_phonons.zip
      - name: Publish reproducible, calculated (not measured) benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geoform-pinned-mineral-phonons
          path: |
            benchmarks/generated/*.json
            benchmarks/geoform_site_phonons.zip
          retention-days: 30
